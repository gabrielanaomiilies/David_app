<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8edcf"/><stop offset="1" stop-color="#e8d4a8"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff0a0"/><stop offset=".38" stop-color="#d99b2e"/><stop offset=".72" stop-color="#f6d36c"/><stop offset="1" stop-color="#895018"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#b77936"/><stop offset="1" stop-color="#75451f"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#4b3214" flood-opacity=".22"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b3e25"/></marker>
</defs>
<rect width="1800" height="1120" rx="34" fill="url(#bg)"/>
<path d="M35 110H1765" stroke="#c49a55" stroke-width="3" opacity=".65"/>
<text x="900" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#1e3555">Chivotul Legământului – componente și explicații</text>
<text x="900" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#70532c">Schemă explicativă după Exodul 25:10–22 · reconstituire, nu desen la scară</text>
<!-- Ark chest -->
