 <ellipse cx="795" cy="430" rx="44" ry="58" fill="url(#gold)" stroke="#865018" stroke-width="7"/><ellipse cx="1005" cy="430" rx="44" ry="58" fill="url(#gold)" stroke="#865018" stroke-width="7"/>
 <path d="M770 385Q795 350 820 385M980 385Q1005 350 1030 385" fill="none" stroke="#865018" stroke-width="7"/>
