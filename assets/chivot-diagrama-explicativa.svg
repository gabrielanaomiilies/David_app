 <path d="M420 265L570 265L670 585"/><path d="M1380 265L1260 265L1170 505"/><path d="M1390 470L1260 470L1100 425"/><path d="M390 820L505 820L590 710"/><path d="M1390 790L1280 790L1180 700"/>
</g>
<!-- labels -->
<g font-family="Arial,sans-serif" filter="url(#shadow)">
 <rect x="55" y="185" width="390" height="170" rx="24" fill="#fff9e9" stroke="#bd8a3c" stroke-width="4"/><text x="85" y="230" font-size="30" font-weight="bold" fill="#1e3555">1. Cufărul din lemn de salcâm</text><text x="85" y="273" font-size="25" fill="#333">Lemnul forma structura;</text><text x="85" y="308" font-size="25" fill="#333">era poleit cu aur pe interior</text><text x="85" y="340" font-size="25" fill="#333">și pe exterior. (Exodul 25:10–11)</text>
 <rect x="1350" y="175" width="395" height="165" rx="24" fill="#fff9e9" stroke="#bd8a3c" stroke-width="4"/><text x="1380" y="220" font-size="30" font-weight="bold" fill="#1e3555">2. Capacul ispășirii</text><text x="1380" y="262" font-size="25" fill="#333">Din aur curat; așezat</text><text x="1380" y="297" font-size="25" fill="#333">deasupra chivotului.</text><text x="1380" y="329" font-size="23" fill="#333">(Exodul 25:17–22)</text>
 <rect x="1350" y="390" width="395" height="175" rx="24" fill="#fff9e9" stroke="#bd8a3c" stroke-width="4"/><text x="1380" y="435" font-size="30" font-weight="bold" fill="#1e3555">3. Doi heruvimi</text><text x="1380" y="477" font-size="25" fill="#333">Lucrați din aur, la capetele</text><text x="1380" y="512" font-size="25" fill="#333">capacului, cu aripile întinse</text><text x="1380" y="546" font-size="23" fill="#333">unul spre altul. (v. 18–20)</text>
 <rect x="55" y="745" width="420" height="180" rx="24" fill="#fff9e9" stroke="#bd8a3c" stroke-width="4"/><text x="85" y="790" font-size="30" font-weight="bold" fill="#1e3555">4. Verigi de aur</text><text x="85" y="832" font-size="25" fill="#333">Patru verigi fixate la colțuri;</text><text x="85" y="867" font-size="25" fill="#333">prin ele treceau drugii pentru</text><text x="85" y="902" font-size="25" fill="#333">transport. (Exodul 25:12–14)</text>
 <rect x="1350" y="690" width="395" height="205" rx="24" fill="#fff9e9" stroke="#bd8a3c" stroke-width="4"/><text x="1380" y="735" font-size="30" font-weight="bold" fill="#1e3555">5. Drugii de transport</text><text x="1380" y="777" font-size="25" fill="#333">Lemn de salcâm poleit cu aur,</text><text x="1380" y="812" font-size="25" fill="#333">trecut prin verigi. Rămâneau</text><text x="1380" y="847" font-size="25" fill="#333">în verigi; chivotul era purtat</text><text x="1380" y="882" font-size="23" fill="#333">fără atingere directă. (v. 13–15)</text>
</g>
<rect x="515" y="930" width="770" height="115" rx="22" fill="#203957"/>
<text x="900" y="974" text-anchor="middle" font-family="Georgia,serif" font-size="29" font-weight="bold" fill="#ffe8ae">Ce ne spune Biblia despre semnificație?</text>
<text x="900" y="1015" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#fff">Chivotul păstra mărturia legământului; Dumnezeu promitea să Se întâlnească</text>
<text x="900" y="1043" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#fff">cu Moise de deasupra capacului. (Exodul 25:16, 22)</text>
</svg>