<g font-family="Arial">
<rect x="65" y="155" width="360" height="150" rx="22" fill="#fff9e9" stroke="#bd8a3c" stroke-width="4"/><text x="95" y="198" font-size="29" font-weight="bold" fill="#1e3555">1. Preoții pregăteau</text><text x="95" y="238" font-size="24" fill="#333">Aaron și fiii lui acopereau</text><text x="95" y="273" font-size="24" fill="#333">obiectele sfinte înainte de transport.</text>
<rect x="1170" y="155" width="365" height="155" rx="22" fill="#fff9e9" stroke="#bd8a3c" stroke-width="4"/><text x="1200" y="198" font-size="29" font-weight="bold" fill="#1e3555">2. Chehatiții purtau</text><text x="1200" y="238" font-size="24" fill="#333">Familia lui Chehat transporta</text><text x="1200" y="273" font-size="24" fill="#333">obiectele sfinte, fără să le atingă.</text>
<rect x="515" y="675" width="570" height="125" rx="22" fill="#203957"/><text x="800" y="720" text-anchor="middle" font-size="29" font-weight="bold" fill="#ffe8ae">3. Drugii sprijineau transportul</text><text x="800" y="760" text-anchor="middle" font-size="23" fill="#fff">Chivotul era purtat pe umeri, nu într-un car. (1 Cronici 15:15)</text>
